<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#08111e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#50caff"/>
      <stop offset="100%" stop-color="#1a8fff"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="88" height="88" rx="18" fill="url(#bg)"/>

  <!-- DXC letters — scaled to fit snugly inside tile -->
  <text x="2" y="58"
        font-family="Outfit, system-ui, sans-serif"
        font-size="40" font-weight="800"
        letter-spacing="-2"
        fill="#ffffff">DXC</text>

  <!-- Blue dot above the X -->
  <circle cx="36" cy="12" r="4.5" fill="url(#acc)"/>

  <!-- Blue bar under the X -->
  <rect x="22" y="63" width="26" height="3" rx="1.5" fill="url(#acc)"/>
</svg>
