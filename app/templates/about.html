{% extends "base.html" %}
{% block title %}{{ t.about_title }} – DXC.GE{% endblock %}
{% block content %}
<section class="page-hero">
  <div class="container">
    <span class="section-tag">{{ t.about_tag }}</span>
    <h1 class="page-hero-title">{{ t.about_title }}</h1>
    <p>{{ t.about_sub }}</p>
  </div>
</section>
<section class="section">
  <div class="container" style="max-width:760px">
    <p style="font-size:1.1rem;line-height:1.9;color:#cdd8e8;margin-bottom:1.5rem">{{ t.about_p1 }}</p>
    <p style="font-size:1.1rem;line-height:1.9;color:#cdd8e8">{{ t.about_p2 }}</p>
  </div>
</section>
{% endblock %}
