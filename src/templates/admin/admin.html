{% extends "base.html" %}

{% block title %}Admin Panel{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/admin.css') }}">
{% endblock %}

{% block content %}

<div class="admin-container" style="display: none;" id="admin-container">

    <h1>Admin Panel</h1>

    <div class="admin-layout">

        <!-- ── LEFT: Users List ────────────────────────────── -->
        <div class="users-panel">
            <h2>Users</h2>
            <div id="usersList"></div>
        </div>

        <!-- ── RIGHT: Editor ──────────────────────────────── -->
        <div class="editor-panel">

            <h2>User Editor</h2>

            <div class="editor-panel-body">
                <form id="editUserForm">

                    <input type="hidden" id="userId">

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="user@example.com">

                    <label for="phone_number">Phone Number</label>
                    <input type="text" id="phone_number" placeholder="+000 000 000 000">

                    <label for="personal_number">Personal Number</label>
                    <input type="text" id="personal_number" placeholder="ID number">

                    <label for="active">Account Status</label>
                    <select id="active">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>

                    <button type="submit">Save Changes</button>

                </form>
            </div>

            <hr>

            <!-- Balance -->
            <div class="balance-section">
                <h3>Modify Balance</h3>

                <form id="balanceForm">

                    <select id="operator">
                        <option value="+">+ Add</option>
                        <option value="-">− Deduct</option>
                    </select>

                    <input type="number"
                           id="amount"
                           placeholder="0.00"
                           step="0.01"
                           min="0">

                    <button type="submit">Apply</button>

                </form>
            </div>

            <div class="admin-message-area">
                <p id="message"></p>
            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
{% endblock %}
