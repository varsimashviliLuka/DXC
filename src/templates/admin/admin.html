{% extends "base.html" %}

{% block title %}Admin Panel{% endblock %}

{% block content %}


<div class="admin-container" style="display: none;" id="admin-container">

    <h1>Admin Panel</h1>

    <div class="admin-layout">

        <!-- LEFT SIDE -->
        <div class="users-panel">

            <h2>Users</h2>

            <div id="usersList"></div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="editor-panel">

            <h2>User Editor</h2>

            <form id="editUserForm">

                <input type="hidden" id="userId">

                <label>Email</label>
                <input type="email" id="email">

                <label>Phone Number</label>
                <input type="text" id="phone_number">

                <label>Personal Number</label>
                <input type="text" id="personal_number">

                <label>Active</label>
                <select id="active">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>

                <button type="submit">
                    Save User
                </button>

            </form>

            <hr>

            <h3>Modify Balance</h3>

            <form id="balanceForm">

                <select id="operator">
                    <option value="+">+</option>
                    <option value="-">-</option>
                </select>

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    step="0.01"
                >

                <button type="submit">
                    Update Balance
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
{% endblock %}
