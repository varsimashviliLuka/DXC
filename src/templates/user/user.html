{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/user.css') }}">
{% endblock %}

{% block content %}

<div class="user-panel-container" id="user-panel-container" style="display: none;">

    <h1>My Profile</h1>

    <!-- ── User Info ───────────────────────────────────────── -->
    <div class="user-info">

        <h2>Account Information</h2>

        <p>
            <strong>Email</strong>
            <span id="userEmail"></span>
        </p>

        <p>
            <strong>Phone</strong>
            <span id="userPhone"></span>
        </p>

        <p>
            <strong>Personal Number</strong>
            <span id="userPersonalNumber"></span>
        </p>

        <p>
            <strong>Balance</strong>
            <span id="userBalance"></span>
        </p>

        <p>
            <strong>Status</strong>
            <span id="userStatus"></span>
        </p>

    </div>

    <!-- ── Transactions ────────────────────────────────────── -->
    <div class="transactions-section">

        <h2>Balance Transactions</h2>

        <div id="transactionsList"></div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/user/user.js') }}"></script>
{% endblock %}
