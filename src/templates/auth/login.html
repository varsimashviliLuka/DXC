{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="login-container">
    <h1>Login</h1>

    <form id="loginForm">
        <input type="text"
               id="email_or_phone_number"
               placeholder="Email or Phone"
               required>

        <input type="password"
               id="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>
    </form>

    <p id="message"></p>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth/login.js') }}"></script>
{% endblock %}
