{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="register-container">

        <!-- Brand mark -->
        <div class="auth-brand">
            <div class="auth-brand-mark">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2z"/>
                </svg>
            </div>
            <span class="auth-brand-name">DXC</span>
        </div>

        <h1>Request Access</h1>
        <p class="auth-subtitle">Create your DXC security account</p>

        <form id="registerForm">

            <div class="input-wrap">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       placeholder="you@example.com"
                       autocomplete="email"
                       required>
            </div>

            <div class="input-wrap">
                <label for="phone_number">Phone Number</label>
                <input type="text"
                       id="phone_number"
                       placeholder="+995 555 000 000"
                       autocomplete="tel"
                       required>
            </div>

            <div class="input-wrap">
                <label for="personal_number">Personal Number</label>
                <input type="text"
                       id="personal_number"
                       placeholder="ID / Personal Number"
                       required>
            </div>

            <div class="input-wrap">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       placeholder="Choose a strong password"
                       autocomplete="new-password"
                       required>
            </div>

            <div class="input-wrap">
                <label for="passwordRepeat">Confirm Password</label>
                <input type="password"
                       id="passwordRepeat"
                       placeholder="Repeat password"
                       autocomplete="new-password"
                       required>
            </div>

            <button type="submit">Create Account</button>

        </form>

        <p id="message"></p>

        <p class="auth-footer-link">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
        </p>

    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/auth/register.js"></script>
{% endblock %}
